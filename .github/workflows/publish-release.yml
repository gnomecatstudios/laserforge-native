name: Publish portable release
# Creates a GitHub release from the portable ZIPs already committed to portable/downloads.
# No build, no checks, no commits.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          for target in windows-x64 linux-x64 RPi-ARM64 RPi-ARM32; do
            test -f "portable/downloads/LaserForge-Portable-$target-v$version.zip" \
              || { echo "Missing $target ZIP for v$version"; exit 1; }
          done
          gh release create "v$version" portable/downloads/*.zip portable/downloads/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Laser Forge v$version" --generate-notes
